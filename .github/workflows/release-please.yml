name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Create release PRs
    runs-on: ubuntu-latest
    # contents: write + pull-requests: write are required by release-please
    # itself (it creates version-bump PRs, tags, and GitHub Releases). These
    # are suppressed in .github/zizmor.yml with the same justification.
    permissions:
      contents: write  # release-please creates release tags, branches and Releases
      pull-requests: write  # release-please opens version-bump PRs
      issues: write  # release-please can add labels/close issues referenced in commits
    steps:
      # Mint a short-lived token for the `nerdit-releaser` GitHub App. The app
      # needs Contents: Read&write + Workflow: Read&write so its tag/commit
      # pushes cascade into the dependent `release.yml` publish workflow
      # (GITHUB_TOKEN pushes do NOT trigger downstream `push: tags` runs).
      # The token is scoped to this repo and to the explicit permissions below
      # so it is not granted every permission the app installation holds.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          owner: NerdIT-Tech
          repositories: devcontainer-features
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please's config only supports a single PR label, so the
      # `no-issue-required` title-lint exemption label is applied here instead
      # of in .release-please-config.json. Runs idempotently on every push.
      - name: Add no-issue-required label to release PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for num in $(gh pr list --repo "$GITHUB_REPOSITORY" --label 'autorelease: pending' --json number -q '.[].number'); do
            gh pr edit "$num" --add-label no-issue-required
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ steps.release.outputs.paths_released != '[]' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Move floating major version tags
        if: ${{ steps.release.outputs.paths_released != '[]' }}
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          RELEASE_OUTPUTS: ${{ toJson(steps.release.outputs) }}
          # Only used to push the floating tags via an immutable ref rewrite;
          # never persisted to the worktree because checkout sets
          # persist-credentials: false above. Uses the same app token as the
          # release-please action so the floating `opencode/v1` tag push also
          # triggers `release.yml` (GITHUB_TOKEN pushes do not cascade).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for path in $(jq -r '.[]' <<<"$PATHS_RELEASED"); do
            key="${path}--tag_name"
            [ "$path" = "." ] && key="tag_name"
            TAG=$(jq -r --arg key "$key" '.[$key]' <<<"$RELEASE_OUTPUTS")
            VERSION="${TAG##*/v}"
            COMPONENT="${TAG%/v"${VERSION}"}"
            MAJOR="${VERSION%%.*}"
            FLOAT_TAG="${COMPONENT}/v${MAJOR}"
            git tag -f "$FLOAT_TAG" "$TAG"
            git push origin "$FLOAT_TAG" --force
          done
