name: Test Dev Container Features

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-features-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifests:
    name: Validate feature manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate devcontainer-feature.json against the spec schema
        # Rich validation from the devcontainers/feature-starter template:
        # checks every manifest against the containers.dev Feature schema.
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772  # v1.4.3
        with:
          validate-only: "true"
          base-path-to-features: "./src"

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1

      - name: Lint shell scripts with shellcheck
        run: mise run lint-shellcheck
