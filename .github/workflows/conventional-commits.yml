name: Conventional Commits

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  lint-pr-title:
    name: Lint PR title
    # Every PR is linted, including automation PRs (release-please here acts
    # as `nerdit-releaser[bot]`). Release-please PRs carry the
    # `no-issue-required` label (see .release-please-config.json), which waives
    # the `subjectPattern` issue-number check via amannn's defaults; labeled/
    # unlabeled are wired in so label changes re-run the lint.
    # Pinned by commit SHA, not a tag: reusable-semantic-pr-title.yml isn't
    # one of NerdIT-Tech/.github's release-please packages (only the composite
    # actions under .github/actions/ are), so it has no version tag yet.
    uses: NerdIT-Tech/.github/.github/workflows/reusable-semantic-pr-title.yml@a6dfc7ae264b00ba0d2f09105c78495ce54a5050
    permissions:
      contents: read  # read caller repo for the reusable semantic-pr-title composite
      pull-requests: write  # sticky "PR title lint" comment on the PR
      statuses: write  # report PR check status for the title lint
    with:
      # Types/requireScope/subjectPattern/exampleCommitTitle already match the
      # reusable workflow's defaults (ported from this repo's own config).
      scopes: |
        feature
        features
        ci
        docs
        deps
        devcontainer
        release
