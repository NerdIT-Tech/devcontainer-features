name: Conventional Commits

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  lint-pr-title:
    name: Lint PR title
    # Every PR is linted, including automation PRs (release-please here acts
    # as `nerdit-releaser[bot]`). Release-please PRs carry the
    # `no-issue-required` label (see .release-please-config.json), which the
    # composite wires to amannn's `ignoreLabels`, exempting labeled PRs from
    # title validation; labeled/unlabeled are wired in so label changes re-run
    # the lint.
    # Pinned by commit SHA, not a tag. The trailing comment names the upstream
    # tag this SHA corresponds to so the pin is auditable (zizmor's
    # ref-version-mismatch relies on the comment matching the tag's target).
    uses: NerdIT-Tech/.github/.github/workflows/reusable-semantic-pr-title.yml@3d72b28099cb73db7facd122cf130b46e108d9ce # semantic-pull-request/v1
    permissions:
      contents: read  # read caller repo for the reusable semantic-pr-title composite
      pull-requests: write  # sticky "PR title lint" comment on the PR
      statuses: write  # report PR check status for the title lint
    with:
      # Types/requireScope/subjectPattern/exampleCommitTitle/ignoreLabels all
      # match the reusable workflow's defaults (ported from this repo's own
      # config; ignoreLabels defaults to `no-issue-required`).
      # Scope a PR title (and its paper trail) to the specific Feature it
      # touches, per issue #42: `fix(xdg-utils): ...` rather than a generic
      # `fix(features): ...`. Repo-wide changes keep the generic scopes.
      scopes: |
        claude-cache
        go-cache
        opencode
        opencode-data
        podman-remote
        xdg-utils
        ci
        docs
        deps
        devcontainer
        release
