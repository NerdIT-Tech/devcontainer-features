name: Release Dev Container Features

on:
  push:
    tags:
      - "claude-cache/v*"
      - "opencode/v*"
      - "opencode-data/v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release-features
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish Features to GHCR
        uses: devcontainers/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          base-path-to-features: "./src"
          generate-docs: "true"
          publish-features: "true"

      - name: Package feature archives
        run: |
          mkdir -p "$RUNNER_TEMP/features"
          for feature in src/*/; do
            [ -f "$feature/devcontainer-feature.json" ] || continue
            manifest="$feature/devcontainer-feature.json"
            id="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$manifest")"
            version="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "$manifest")"
            tar -czf "$RUNNER_TEMP/features/${id}_${version}.tgz" -C "$feature" .
          done
        shell: bash

      - name: Upload feature archives
        uses: actions/upload-artifact@v4
        with:
          name: devcontainer-features
          path: ${{ runner.temp }}/features/*.tgz
          if-no-files-found: error
