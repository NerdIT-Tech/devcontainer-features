name: Zizmor

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/zizmor.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows
    # Pinned by commit SHA -- see conventional-commits.yml for why.
    # NOTE: currently pinned to the reusable-zizmor.yml commit (PR #44 head);
    # update to the merged main SHA once NerdIT-Tech/.github#44 lands.
    uses: NerdIT-Tech/.github/.github/workflows/reusable-zizmor.yml@4c154ddc91502f21c37f769fd60f9938eb7ac14c
    permissions:
      contents: read
    with:
      fail-on-finding: true
