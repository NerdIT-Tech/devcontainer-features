name: Zizmor

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/zizmor.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows
    # Pinned by commit SHA -- see conventional-commits.yml for why.
    uses: NerdIT-Tech/.github/.github/workflows/reusable-zizmor.yml@4ce4c867e4c2c2793fad0749740235f9b0d227d7
    permissions:
      contents: read
    with:
      fail-on-finding: true
