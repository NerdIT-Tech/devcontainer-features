name: Test Dev Container Features in Containers

# Ported from the devcontainers/feature-starter template. Unlike the static
# test.yml (which only checks JSON/sh syntax), this workflow actually BUILDS
# each Feature in a real container and runs its test.sh via the @devcontainers/cli,
# plus scenario tests where a Feature needs mounts/lifecycle hooks to be applied
# (opencode-data, claude-cache).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-feature-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  autogenerated:
    name: "${{ matrix.feature }} (autogenerated)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Only 'opencode' is exercised here: the autogenerated test path
      # (--skip-scenarios) runs test/<feature>/test.sh in a plain container with
      # no volumes and no onCreateCommand, which is fine for a standalone CLI
      # install but meaningless for the volume-mount features. opencode-data and
      # claude-cache are covered by the scenario job below where mounts +
      # onCreate are actually applied.
      matrix:
        feature: [opencode]
        baseImage:
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install devcontainer CLI
        env:
          DEVCONTAINERS_CLI_VERSION: "0.89.0"
        run: npm install -g "@devcontainers/cli@${DEVCONTAINERS_CLI_VERSION}"

      - name: "Run autogenerated tests for '${{ matrix.feature }}' on '${{ matrix.baseImage }}'"
        env:
          FEATURE: ${{ matrix.feature }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: devcontainer features test --skip-scenarios -f "$FEATURE" -i "$BASE_IMAGE" .

  scenarios:
    name: "${{ matrix.scenario }} (scenario)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [opencode-data, claude-cache, go-cache]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install devcontainer CLI
        env:
          DEVCONTAINERS_CLI_VERSION: "0.89.0"
        run: npm install -g "@devcontainers/cli@${DEVCONTAINERS_CLI_VERSION}"

      - name: "Run '${{ matrix.scenario }}' scenario tests"
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: devcontainer features test -f "$SCENARIO" --skip-autogenerated --skip-duplicated .
