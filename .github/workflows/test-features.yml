name: Test Dev Container Features in Containers

# Ported from the devcontainers/feature-starter template. Unlike the static
# test.yml (which only checks JSON/sh syntax), this workflow actually BUILDS
# each Feature in a real container and runs its test.sh via the @devcontainers/cli,
# plus scenario tests where a Feature needs mounts/lifecycle hooks to be applied
# (opencode-data, claude-cache).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-feature-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed features
    runs-on: ubuntu-latest
    outputs:
      autogenerated: ${{ steps.detect.outputs.autogenerated }}
      scenarios: ${{ steps.detect.outputs.scenarios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Scope every test job to the Features this change actually touches so
      # each PR's test run matches its feature (issue #42). A change outside
      # src/ and test/ (workflows, repo docs, ...) falls back to running
      # everything, since it could affect any feature.
      - id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          autogen_all=(opencode podman-remote xdg-utils)
          scenarios_all=(opencode-data claude-cache go-cache)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            changed=$(git diff --name-only "$EVENT_BEFORE...HEAD")
          else
            # workflow_dispatch and friends: no diff base, run everything.
            changed=""
            changed=$'\nfull-run\n'
          fi
          features=()
          full_run=false
          while IFS= read -r f; do
            case "$f" in
              src/*|test/*)
                feature="${f#*/}"
                feature="${feature%%/*}"
                features+=("$feature")
                ;;
              "") ;;
              *) full_run=true ;;
            esac
          done <<< "$changed"
          if [ "$full_run" = true ] || [ "${#features[@]}" -eq 0 ]; then
            autogen=("${autogen_all[@]}")
            scenarios=("${scenarios_all[@]}")
          else
            autogen=()
            scenarios=()
            for feature in $(printf '%s\n' "${features[@]}" | sort -u); do
              for a in "${autogen_all[@]}"; do [ "$feature" = "$a" ] && autogen+=("$a"); done
              for s in "${scenarios_all[@]}"; do [ "$feature" = "$s" ] && scenarios+=("$s"); done
            done
          fi
          autogen_json=$(jq -cn --args '$ARGS.positional' "${autogen[@]}")
          scenarios_json=$(jq -cn --args '$ARGS.positional' "${scenarios[@]}")
          echo "autogenerated=$autogen_json" >> "$GITHUB_OUTPUT"
          echo "scenarios=$scenarios_json" >> "$GITHUB_OUTPUT"
          echo "autogenerated: $autogen_json"
          echo "scenarios: $scenarios_json"

  autogenerated:
    name: "${{ matrix.feature }} (autogenerated)"
    needs: changes
    if: ${{ needs.changes.outputs.autogenerated != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
# Only standalone-install features are exercised here: the autogenerated
      # test path (--skip-scenarios) runs test/<feature>/test.sh in a plain
      # container with no volumes and no onCreateCommand, which is fine for a
      # CLI install but meaningless for the volume-mount features. opencode-data,
      # claude-cache and go-cache are covered by the scenario job below where
      # mounts + onCreate are actually applied.
      matrix:
        feature: ${{ fromJson(needs.changes.outputs.autogenerated) }}
        baseImage:
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1

      - name: "Run autogenerated tests for '${{ matrix.feature }}' on '${{ matrix.baseImage }}'"
        env:
          FEATURE: ${{ matrix.feature }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: mise run test -- "$FEATURE" "$BASE_IMAGE"

  scenarios:
    name: "${{ matrix.scenario }} (scenario)"
    needs: changes
    if: ${{ needs.changes.outputs.scenarios != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJson(needs.changes.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1

      - name: "Run '${{ matrix.scenario }}' scenario tests"
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: mise run test-scenarios -- "$SCENARIO"
