# Pinned tool versions + task runner so local runs match CI (issue #41).
# Install mise: https://mise.jdx.dev/getting-started.html
# Then in this repo: `mise install` once, and `mise run <task>` afterwards.

[tools]
node = "22"
python = "3.12"
uv = "latest"
"npm:@devcontainers/cli" = "0.89.0"
actionlint = "1.7.12"
yamllint = "1.38.0"

[tasks.validate]
description = "Validate feature manifests (JSON) and shell scripts (bash -n)"
run = '''
set -eu
any_failed=false
for dir in src/*/; do
  name="$(basename "$dir")"
  echo "--- validating $name ---"
  python3 -c "import json,sys; json.load(open('$dir/devcontainer-feature.json'))" \
    || { echo "invalid JSON in ${name}"; any_failed=true; }
  if [ ! -f "$dir/install.sh" ]; then
    echo "missing install.sh in ${name}"; any_failed=true
  else
    bash -n "$dir/install.sh" || { echo "syntax error in ${name}/install.sh"; any_failed=true; }
  fi
  if [ -f "$dir/onCreate.sh" ]; then
    bash -n "$dir/onCreate.sh" || { echo "syntax error in ${name}/onCreate.sh"; any_failed=true; }
  fi
done
if [ "$any_failed" = true ]; then
  echo "::error::One or more features failed validation"
  exit 1
fi
'''

[tasks.lint-yaml]
description = "Lint YAML files with yamllint"
run = "yamllint ."

[tasks.lint-actions]
description = "Lint GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks.test]
description = "Run autogenerated feature tests: mise run test -- <feature> [baseImage]"
usage = """arg "<feature>"
arg "[base_image]""""
run = '''
set -eu
feature="$usage_feature"
base="${usage_base_image:-mcr.microsoft.com/devcontainers/base:ubuntu}"
devcontainer features test --skip-scenarios -f "$feature" -i "$base" .
'''

[tasks."test-scenarios"]
description = "Run scenario feature tests: mise run test-scenarios -- <feature>"
usage = 'arg "<feature>"'
run = '''
set -eu
devcontainer features test -f "$usage_feature" --skip-autogenerated --skip-duplicated .
'''
